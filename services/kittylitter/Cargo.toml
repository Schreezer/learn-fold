[workspace]

[package]
name = "learnfold-link"
version = "0.3.7"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Learnfold"]
repository = "https://github.com/Schreezer/learnfold-link"
homepage = "https://github.com/Schreezer/learnfold-link"
description = "Securely connects a learner-owned coding agent to the Learnfold app."
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "040AC730-0882-4343-8CEE-D62BCE80CC95"
path-guid = "1843B30F-41A4-446B-B1FB-3A123CC78BCD"
license = false
eula = false

[[bin]]
name = "learnfold-link"
path = "src/main.rs"

[dependencies]
# One reviewed, reproducible Alleycat revision: iroh 1.0.3 Happy Eyeballs,
# durable Hermes continuity, and the authenticated production Runs lifecycle.
alleycat = { git = "https://github.com/Schreezer/alleycat.git", rev = "e2edae8061c1ab6f7af255ef3d6583c6605159bd" }
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
url = "2"

# cargo-dist builds with `cargo build --profile dist`. Mirrors the
# upstream alleycat workspace's profile so binaries are LTO-thinned in
# release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
