[workspace]

[package]
name = "learnfold-link"
version = "0.3.6"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Learnfold"]
repository = "https://github.com/Schreezer/learnfold-link"
homepage = "https://github.com/Schreezer/learnfold-link"
description = "Securely connects a learner-owned coding agent to the Learnfold app."
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "040AC730-0882-4343-8CEE-D62BCE80CC95"
path-guid = "1843B30F-41A4-446B-B1FB-3A123CC78BCD"
license = false
eula = false

[[bin]]
name = "learnfold-link"
path = "src/main.rs"

[dependencies]
# Tracks dnakov/alleycat main. `./tools/scripts/update-alleycat-main.sh`
# refreshes Cargo.lock to whatever `main` points at before build/release lanes.
alleycat = { git = "https://github.com/dnakov/alleycat.git", branch = "main" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
url = "2"

# cargo-dist builds with `cargo build --profile dist`. Mirrors the
# upstream alleycat workspace's profile so binaries are LTO-thinned in
# release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
