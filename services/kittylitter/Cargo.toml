[workspace]

[package]
name = "learnfold-link"
version = "0.3.10"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Learnfold"]
repository = "https://github.com/Schreezer/learnfold-link"
homepage = "https://github.com/Schreezer/learnfold-link"
description = "Securely connects a learner-owned coding agent to the Learnfold app."
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "040AC730-0882-4343-8CEE-D62BCE80CC95"
path-guid = "1843B30F-41A4-446B-B1FB-3A123CC78BCD"
license = false
eula = false

[[bin]]
name = "learnfold-link"
path = "src/main.rs"

[dependencies]
# Pin the reviewed public connector commit so every npm install gets the same
# durable Hermes transcript and service-profile behavior.
alleycat = { git = "https://github.com/Schreezer/alleycat.git", rev = "3fd3be461a1fa63944e277074ba1d9dce6f02ef6" }
anyhow = "1"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
url = "2"

# cargo-dist builds with `cargo build --profile dist`. Mirrors the
# upstream alleycat workspace's profile so binaries are LTO-thinned in
# release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
